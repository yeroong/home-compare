<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#117A72">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="집어봐">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>집어봐</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F8FAFA;--card:#ffffff;--card2:#F1F6F5;--text:#26343B;--muted:#75838A;--muted2:#A3AEB3;--line:#E6ECEB;
  --accent:#117A72;--accent-weak:#E3F4F1;--accent-text:#ffffff;--accent-deep:#0E635C;--mint:#42C7B6;--mint-weak:#DDF5F1;--coral:#FF745E;--coral-weak:#FFE9E4;
  --good:#1E8E5A;--good-bg:#E4F6EC;--warn:#B8670A;--warn-bg:#FFF2DF;--bad:#D6453A;--bad-bg:#FDE9E6;
  --radius:16px;--radius-s:12px;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1817;--card:#162220;--card2:#1C2B29;--text:#E8F0EE;--muted:#9AB0AB;--muted2:#6E8580;--line:#273734;
    --accent:#4FD1BF;--accent-weak:#163C37;--accent-text:#07201C;--accent-deep:#7FE3D4;--mint:#42C7B6;--mint-weak:#1B3B37;--coral:#FF8A76;--coral-weak:#4A2A24;
    --good:#5BD69A;--good-bg:#14352A;--warn:#F5B454;--warn-bg:#3A2C12;--bad:#FF8A7E;--bad-bg:#3E1F1C;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1817;--card:#162220;--card2:#1C2B29;--text:#E8F0EE;--muted:#9AB0AB;--muted2:#6E8580;--line:#273734;
  --accent:#4FD1BF;--accent-weak:#163C37;--accent-text:#07201C;--accent-deep:#7FE3D4;--mint:#42C7B6;--mint-weak:#1B3B37;--coral:#FF8A76;--coral-weak:#4A2A24;
  --good:#5BD69A;--good-bg:#14352A;--warn:#F5B454;--warn-bg:#3A2C12;--bad:#FF8A7E;--bad-bg:#3E1F1C;--shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden;max-width:100vw}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100dvh;overscroll-behavior:none;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{margin:0}
a{color:var(--accent)}
.grid2>*,.grid3>*,.row>*,.field,.unit{min-width:0}
.unit input{width:100%}
.card{max-width:100%}
img,canvas{max-width:100%}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px}

/* 상단 */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;height:54px;padding:0 10px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .back{width:40px;height:40px;border-radius:12px;display:none;align-items:center;justify-content:center;color:var(--text)}
.top .back:active{background:var(--card2)}
.top.has-back .back{display:flex}
.top h1{flex:1;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.top .acts{display:flex;gap:4px}
.top .acts button{height:34px;padding:0 12px;border-radius:999px;background:var(--accent-weak);color:var(--accent);font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px}

main{flex:1;padding:14px 16px calc(88px + var(--safe-b));max-width:720px;width:100%;margin:0 auto}

/* 하단 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabs button{flex:1;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted2);font-size:11px;font-weight:600}
.tabs button svg.i{width:23px;height:23px}
.tabs button.on{color:var(--accent)}
.tabs button.on svg.i{stroke-width:2.3}

/* 카드·공통 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card h2{font-size:14px;color:var(--text);font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .t{display:flex;align-items:center;gap:7px}
.card h2 .t svg.i{width:18px;height:18px;color:var(--accent)}
.card h2 .sub{font-size:12px;font-weight:500;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:11px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.empty{text-align:center;color:var(--muted);padding:44px 16px}
.empty .big{width:64px;height:64px;border-radius:20px;background:var(--accent-weak);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.empty .big svg.i{width:30px;height:30px}
.empty b{color:var(--text);font-size:16px}

.btn{height:46px;padding:0 18px;border-radius:13px;background:var(--accent);color:var(--accent-text);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:filter .12s}
.btn:active{filter:brightness(.92)}
.btn.sec{background:var(--accent-weak);color:var(--accent)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{height:36px;padding:0 13px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--accent-weak);color:var(--accent);white-space:nowrap}
.badge.월세{background:#fff1d6;color:#9a5b00}.badge.전세{background:#e3f5e8;color:#1a7f3c}.badge.매매{background:#ece4ff;color:#5b2fb3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.월세{background:#3d2d10;color:#f6c344}:root:not([data-theme="light"]) .badge.전세{background:#143322;color:#6cc070}:root:not([data-theme="light"]) .badge.매매{background:#2a1d4a;color:#b39ddb}}
:root[data-theme="dark"] .badge.월세{background:#3d2d10;color:#f6c344}:root[data-theme="dark"] .badge.전세{background:#143322;color:#6cc070}:root[data-theme="dark"] .badge.매매{background:#2a1d4a;color:#b39ddb}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.neutral{background:var(--card2);color:var(--muted)}
.chip svg.i{width:13px;height:13px}

/* 입력 */
.field{margin-bottom:12px}
.field label,.lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.inp{width:100%;height:46px;padding:0 13px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--card2);outline:none;transition:border-color .12s,box-shadow .12s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak);background:var(--card)}
textarea.inp{height:auto;min-height:84px;padding:10px 13px;resize:vertical;line-height:1.5}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.unit{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--card2);height:46px;overflow:hidden;transition:border-color .12s,box-shadow .12s}
.unit:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak);background:var(--card)}
.unit input{flex:1;min-width:0;border:0;background:transparent;height:100%;padding:0 12px;outline:none;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.unit span{padding:0 10px;color:var(--muted);font-size:12px;white-space:nowrap;border-left:1px solid var(--line);height:100%;display:flex;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.seg.sm button{height:30px;font-size:12.5px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-radius:var(--radius-s);background:var(--accent-weak);color:var(--accent-deep);font-weight:700;margin-top:10px}
.total .n{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.toggle{display:flex;flex-wrap:wrap;gap:8px}
.toggle button{height:36px;padding:0 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.toggle button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.toggle button i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* 점수 */
.score{padding:11px 0;border-bottom:1px solid var(--line)}
.score:last-child{border-bottom:0}
.score .nm{display:flex;justify-content:space-between;align-items:baseline;font-size:14.5px;font-weight:600;margin-bottom:7px;gap:8px}
.score .nm .v{color:var(--muted);font-size:12.5px;font-weight:600}
.score .nm .v.g{color:var(--good)}.score .nm .v.w{color:var(--warn)}.score .nm .v.b{color:var(--bad)}
.score .bar{display:flex;gap:6px}
.score .bar button{flex:1;height:38px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-weight:700;color:var(--muted);font-size:14px;transition:transform .08s}
.score .bar button:active{transform:scale(.96)}
.score .bar button.on{color:#fff;border-color:transparent}
.score .bar button.on.s1,.score .bar button.on.s2{background:var(--bad)}
.score .bar button.on.s3{background:var(--warn)}
.score .bar button.on.s4,.score .bar button.on.s5{background:var(--good)}
.score .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted2);margin-top:4px}
.score .how{font-size:12px;color:var(--muted);margin-top:5px;padding:6px 9px;border-radius:8px;background:var(--card2);line-height:1.45}
.tri{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;flex:none}
.tri button{height:30px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tri button.on1{background:var(--good);color:#fff}.tri button.on2{background:var(--bad);color:#fff}.tri button.on0{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);position:relative;flex:none;letter-spacing:-.02em}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card)}
.ring span{position:relative}
.ring.lg{width:84px;height:84px;font-size:26px}
.meter{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:5px 0}
.meter .l{width:30px;flex:none;font-weight:600}
.meter .b{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter .b i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.meter .n{width:30px;text-align:right;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.cat4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat4 .c{background:var(--card2);border-radius:12px;padding:9px 6px;text-align:center}
.cat4 .c .n{font-size:18px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cat4 .c .l{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}

/* 매물 카드 */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.summary .s{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.summary .s .l{font-size:11px;color:var(--muted);font-weight:600}
.summary .s .n{font-size:17px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.lst{display:flex;gap:12px;padding:12px;align-items:stretch;position:relative;overflow:hidden}
.lst .th{width:92px;height:112px;border-radius:12px;background:var(--card2);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted2)}
.lst .th img{width:100%;height:100%;object-fit:cover}
.lst .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lst .nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.lst .pr{font-weight:800;font-size:16.5px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lst .mt{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst .pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.lst .cmp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--muted);padding-left:8px;border-left:1px solid var(--line);flex:none}
.lst .cmp input{width:22px;height:22px;accent-color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(78px + var(--safe-b));z-index:15;height:52px;padding:0 20px 0 16px;border-radius:26px;background:var(--accent);color:var(--accent-text);font-weight:700;font-size:15.5px;box-shadow:0 8px 22px rgba(17,122,114,.32);display:flex;align-items:center;gap:6px}

/* 상세 머리 */
.head{display:flex;gap:14px;align-items:center}
.head .nm{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.head .ad{font-size:12.5px;color:var(--muted);margin-top:2px}
.head .pr{font-size:15px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* 서브탭 */
.subtabs{display:flex;gap:4px;overflow-x:auto;margin:-2px -16px 12px;padding:4px 16px;scrollbar-width:none;position:sticky;top:54px;z-index:10;background:var(--bg)}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;height:36px;padding:0 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.subtabs button.on{background:var(--text);border-color:var(--text);color:var(--bg)}

/* 공간 */
.room{display:flex;align-items:center;gap:12px;padding:13px 14px}
.room .dot{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#1a1a1a}
.room .nm{font-weight:700}
.room .sz{font-size:12.5px;color:var(--muted)}
.room .rt{text-align:right;font-size:12px;color:var(--muted)}
.room .rt b{display:block;font-size:17px;color:var(--text);letter-spacing:-.02em}
.kinds{display:flex;flex-wrap:wrap;gap:8px}
.kinds button{height:36px;padding:0 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.kinds button i{width:10px;height:10px;border-radius:3px;display:inline-block}
.kinds button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}

/* 사진 */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos .ph{aspect-ratio:1;border-radius:11px;overflow:hidden;background:var(--card2);position:relative}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph .cap{position:absolute;left:0;right:0;bottom:0;padding:3px 7px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:14px}
.photos .add{aspect-ratio:1;border-radius:11px;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:12px;font-weight:600;gap:4px;background:transparent}
.photos .add svg.i{width:22px;height:22px}
.viewer{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;color:#fff}
.viewer .img{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .bar{display:flex;gap:8px;padding:10px 12px calc(10px + var(--safe-b));align-items:center}
.viewer .bar input{flex:1;height:40px;border-radius:10px;border:0;padding:0 12px;background:#222;color:#fff}
.viewer .bar button{height:40px;padding:0 12px;border-radius:10px;background:#222;color:#fff;font-weight:600}
.viewer .hd{display:flex;justify-content:space-between;align-items:center;padding:12px;font-size:14px;color:#ccc}
.viewer .hd button{color:#fff;font-size:22px;width:40px}

/* 평면도·3D */
.planwrap{position:relative;height:min(62vh,520px);border-radius:14px;overflow:hidden;background:var(--card2);border:1px solid var(--line);touch-action:none}
.planwrap canvas{display:block;width:100%;height:100%}
.planbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.selinfo{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--accent-weak);display:flex;align-items:center;gap:10px;font-size:13.5px}
.selinfo b{color:var(--accent-deep)}
.overlay-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px;pointer-events:none;font-size:14px}

/* 비교 */
.cmpwrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.cmp{border-collapse:separate;border-spacing:0;min-width:100%;font-size:13.5px}
table.cmp th,table.cmp td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right;vertical-align:middle;font-variant-numeric:tabular-nums}
table.cmp th{text-align:left;font-weight:600;color:var(--muted);position:sticky;left:0;background:var(--card);z-index:2;width:112px;min-width:112px;max-width:112px;white-space:normal;line-height:1.25}
table.cmp th .mini{display:block;font-size:11px;color:var(--muted2);font-weight:400;margin-top:2px}
table.cmp thead th{position:sticky;top:0;background:var(--card);color:var(--text);text-align:right;z-index:3;font-weight:700}
table.cmp thead th:first-child{z-index:4}
table.cmp td.best{background:var(--good-bg);color:var(--good);font-weight:700}
table.cmp td.worst{color:var(--bad)}
table.cmp tr.sec th,table.cmp tr.sec td{background:var(--card2);color:var(--muted);font-size:11.5px;font-weight:700;padding:5px 10px;letter-spacing:.02em}
table.cmp td .mini{display:block;font-size:11px;color:var(--muted);font-weight:400}
table.cmp td .mb{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;margin-left:6px;overflow:hidden}
table.cmp td .mb i{display:block;height:100%;background:var(--accent)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pills span{padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;display:flex;gap:6px;align-items:center;font-weight:600}
.pills span button{color:var(--muted);font-size:16px;line-height:1}

/* 바닥 시트 */
.sheet-bg{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-height:88vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.sheet .hd{padding:14px 16px 8px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.sheet .bd{overflow-y:auto;padding:0 16px 8px}
.sheet .ft{padding:10px 16px;display:flex;gap:8px;border-top:1px solid var(--line)}
.rrow{display:grid;grid-template-columns:1fr 84px;gap:6px;padding:8px 0;border-bottom:1px dashed var(--line)}
.rrow .sz{display:grid;grid-template-columns:1fr 1fr;gap:6px;grid-column:1/-1}
.rrow .inp,.rrow .unit{height:38px}
.rrow .est{grid-column:1/-1;font-size:12px;color:var(--muted)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:.95}
.hidden{display:none!important}
.lst .cmp input{accent-color:var(--coral)}
.summary .s .n.coral{color:var(--coral)}
.logo-mark{display:block}
.onb{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 28px calc(24px + var(--safe-b));text-align:center}
.onb .art{height:230px;display:flex;align-items:center;justify-content:center}
.onb h3{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:8px 0 8px}
.onb p{color:var(--muted);font-size:14.5px;line-height:1.65;margin:0;max-width:320px}
.onb .dots{display:flex;gap:6px;margin:24px 0}
.onb .dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s}.onb .dots i.on{width:20px;background:var(--accent)}
.onb .btns{display:flex;gap:8px;width:100%;max-width:320px}
.onb .skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;color:var(--muted);font-weight:600;padding:8px}
.brandcard{display:flex;align-items:center;gap:14px}
.links{display:flex;flex-direction:column;gap:6px}
.townhead{display:flex;align-items:center;gap:10px;padding:4px 2px}
.post .pt{font-weight:800;font-size:16px;letter-spacing:-.01em;margin-top:8px}
.post .pb{font-size:14px;margin-top:4px;white-space:pre-wrap;line-height:1.55}
.psum{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.cmts{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.cmt{font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}.cmt:last-of-type{border-bottom:0}
.lk{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:12px;background:var(--card2)}
.lk .lk-t{display:flex;align-items:center;gap:6px;font-size:14px;min-width:0}.lk .lk-t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk .lk-u{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk button{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}.lk button:active{background:var(--line)}
.brandcard .sl{font-size:13px;color:var(--muted);margin-top:2px}

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('homecmp',2);
  r.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains('listings'))d.createObjectStore('listings',{keyPath:'id'});
    if(!d.objectStoreNames.contains('photos')){const p=d.createObjectStore('photos',{keyPath:'id'});p.createIndex('listingId','listingId');p.createIndex('roomId','roomId');}
    if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv',{keyPath:'k'});
    if(!d.objectStoreNames.contains('posts')){const p=d.createObjectStore('posts',{keyPath:'id'});p.createIndex('dong','dong');}};
  r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=()=>rej(r.error);});}
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const st=(n,m='readonly')=>db.transaction(n,m).objectStore(n);
const dbPut=(n,v)=>rq(st(n,'readwrite').put(v));
const dbGet=(n,k)=>rq(st(n).get(k));
const dbAll=n=>rq(st(n).getAll());
const dbDel=(n,k)=>rq(st(n,'readwrite').delete(k));
const dbIdx=(n,i,k)=>rq(st(n).index(i).getAll(k));
const dbClear=n=>rq(st(n,'readwrite').clear());

function toastM(m){const t=$('#toast');t.innerHTML=`<span style="display:inline-flex;align-items:center;gap:8px">${BRAND.mascot('wink',30)}${esc(m)}</span>`;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200);}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800);}
function fmtMan(n){n=Math.round(+n||0);if(!n)return '-';const e=Math.floor(n/10000),m=n%10000;let s='';if(e)s+=e+'억';if(m)s+=(e?' ':'')+m.toLocaleString()+'만';return s;}
function fmtMan1(n){n=+n||0;if(!n)return '-';if(n>=10000)return fmtMan(n);return (Math.round(n*10)/10).toLocaleString()+'만';}
function areaStr(m2){m2=+m2||0;if(!m2)return '-';return S.settings.unit==='평'?(m2/PY).toFixed(1)+'평':m2.toFixed(1)+'㎡';}
function areaBoth(m2){m2=+m2||0;if(!m2)return '-';return m2.toFixed(1)+'㎡ · '+(m2/PY).toFixed(1)+'평';}
const roomArea=r=>(+r.w||0)*(+r.d||0)/10000;
const roomChecks=k=>ROOM_CHECKS[k]||ROOM_CHECKS.default;
function feesSum(l){return Object.values(l.fees||{}).reduce((a,b)=>a+(+b||0),0);}
const loanInt=l=>(+l.loan||0)*(+l.loanRate||0)/1200;           // 월 대출 이자
function ownCash(l){const base=l.type==='매매'?+l.price||0:+l.deposit||0;return Math.max(base-(+l.loan||0),0);} // 자기 자금
const ownInt=l=>ownCash(l)*(+S.settings.rate||0)/1200;           // 자기 자금 기회비용(월)
function monthly(l){return (l.type==='월세'?(+l.rent||0):0)+loanInt(l)+ownInt(l)+feesSum(l);}
function costCard(l){const own=ownCash(l),base=l.type==='매매'?'매매가':'보증금';
  const kv=(k,v)=>`<div class="kv"><span>${k}</span><b>${fmtMan1(v)}</b></div>`;
  return `<div class="card" id="costCard"><h2><span class="t">${IC.calc}월 실질 비용</span></h2>
    ${l.type==='월세'?kv('월세',+l.rent||0):''}
    ${+l.loan?kv(`대출 이자 <span class="small muted">${fmtMan(l.loan)} × 연 ${+l.loanRate||0}%</span>`,loanInt(l)):''}
    ${kv(`자기 자금 환산 <span class="small muted">${base}${+l.loan?' − 대출':''} ${fmtMan(own)} × 연 ${S.settings.rate}%</span>`,ownInt(l))}
    ${kv('관리비 합계',feesSum(l))}
    <div class="total"><span>합계 / 월</span><span class="n">${fmtMan1(monthly(l))}</span></div>
    <div class="hint">대출 이자는 입력한 금리로, ${base}에서 대출을 뺀 자기 자금은 설정의 연이율(${S.settings.rate}%)로 월 비용에 환산해 다른 유형과 비교합니다.</div></div>`;}
function priceLine(l){
  if(l.type==='매매')return '매매 '+fmtMan(l.price);
  if(l.type==='전세')return '전세 '+fmtMan(l.deposit);
  return '보증금 '+fmtMan(l.deposit)+' / 월 '+fmtMan(l.rent);}
function allScores(l){const v=[];HOME_CHECKS.forEach(c=>{const x=+(l.checks||{})[c[0]];if(x>0)v.push(x)});
  (l.rooms||[]).forEach(r=>roomChecks(r.kind).forEach(c=>{const x=+(r.scores||{})[c[0]];if(x>0)v.push(x)}));return v;}
function roomScore(r){const v=roomChecks(r.kind).map(c=>+(r.scores||{})[c[0]]||0).filter(x=>x>0);return v.length?Math.round(v.reduce((a,b)=>a+b)/v.length*20):0;}
function kindArea(l,k){return (l.rooms||[]).filter(r=>r.kind===k).reduce((a,r)=>a+roomArea(r),0);}
function getL(id){return S.listings.find(l=>l.id===id);}
function photoURL(p,thumb){const key=p.id+(thumb?'_t':'');if(!urlCache.has(key))urlCache.set(key,URL.createObjectURL(thumb&&p.thumb?p.thumb:p.blob));return urlCache.get(key);}
function dropURL(id){['','_t'].forEach(s=>{const k=id+s;if(urlCache.has(k)){URL.revokeObjectURL(urlCache.get(k));urlCache.delete(k);}});}
function dateStr(t){const d=new Date(t);return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');}

function newListing(){const n=S.listings.length+1;return {id:uid(),name:'매물 '+n,type:'월세',addr:'',floor:'',totalFloors:'',direction:'',moveIn:'',visitedAt:new Date().toISOString().slice(0,10),

  checks:{},site:{},safety:{checks:{}},cond:{options:[]},init:{},links:[],pros:'',cons:'',memo:'',createdAt:Date.now(),updatedAt:Date.now()};}
function fix(l){l.site=l.site||{};l.safety=l.safety||{};l.safety.checks=l.safety.checks||{};l.cond=l.cond||{};l.cond.options=l.cond.options||[];l.init=l.init||{};l.checks=l.checks||{};l.links=l.links||[];return l;}
/* 중개보수 법정 상한(주택, 2021.10 개정 요율) · 만원 */
function brokerFee(l){let amt,tbl;
  if(l.type==='매매'){amt=+l.price||0;tbl=[[5000,.006,25],[20000,.005,80],[90000,.004,0],[120000,.005,0],[150000,.006,0],[Infinity,.007,0]];}
  else{const dep=+l.deposit||0,rent=l.type==='월세'?(+l.rent||0):0;amt=dep+rent*100;if(amt<5000)amt=dep+rent*70;tbl=[[5000,.005,20],[10000,.004,30],[60000,.003,0],[120000,.004,0],[150000,.005,0],[Infinity,.006,0]];}
  if(!amt)return 0;const row=tbl.find(r=>amt<r[0]);let fee=amt*row[1];if(row[2])fee=Math.min(fee,row[2]);return Math.round(fee*10)/10;}
function initialCost(l){const own=ownCash(l);const i=l.init||{};return {own,broker:+i.broker||0,moving:+i.moving||0,interior:+i.interior||0,other:+i.other||0,total:own+(+i.broker||0)+(+i.moving||0)+(+i.interior||0)+(+i.other||0)};}
/* 전세가율(위험도): (선순위 채권 + 다가구 선순위 보증금 + 내 보증금) / 시세 */
function jeonseRatio(l){const s=l.safety||{};const mp=+s.marketPrice||0;if(!mp||l.type==='매매')return null;const dep=+l.deposit||0;if(!dep)return null;return Math.round(((+s.lien||0)+(+s.seniorDeposit||0)+dep)/mp*100);}
function ratioLevel(r){if(r==null)return null;return r>=80?'bad':r>=70?'warn':'good';}
/* 항목별 점수(100) : 비용은 매물끼리 상대, 나머지는 입력값 평균 */
const avg=a=>a.length?a.reduce((x,y)=>x+y)/a.length:null;
function siteScore(l){const v=[];HOME_GROUPS[2][1].forEach(c=>{const x=+(l.checks||{})[c[0]];if(x>0)v.push(x)});const cm=+(l.site||{}).commute;if(cm>0)v.push(cm<=20?5:cm<=30?4:cm<=45?3:cm<=60?2:1);const a=avg(v);return a==null?null:Math.round(a*20);}
function condScore(l){const v=[];[HOME_GROUPS[0],HOME_GROUPS[1]].forEach(g=>g[1].forEach(c=>{const x=+(l.checks||{})[c[0]];if(x>0)v.push(x)}));(l.rooms||[]).forEach(r=>roomChecks(r.kind).forEach(c=>{const x=+(r.scores||{})[c[0]];if(x>0)v.push(x)}));const a=avg(v);return a==null?null:Math.round(a*20);}
function safeScore(l){const ch=(l.safety||{}).checks||{};const vals=SAFETY_CHECKS.map(c=>+ch[c[0]]||0);const n=vals.filter(x=>x>0).length;if(!n)return null;let s=Math.round(vals.filter(x=>x===1).length/SAFETY_CHECKS.length*100);if(vals.some(x=>x===2))s=Math.min(s,40);const r=jeonseRatio(l);if(r!=null){if(r>=90)s=Math.min(s,25);else if(r>=80)s=Math.min(s,45);else if(r>=70)s=Math.min(s,65);}return s;}
function costScore(l,all){const ls=(all||S.listings).filter(x=>monthly(x)>0);if(ls.length<2)return null;const m=ls.map(monthly),mn=Math.min(...m),mx=Math.max(...m);const c=monthly(l);if(!c)return null;if(mx===mn)return 80;return Math.round(100-60*(c-mn)/(mx-mn));}
function catScores(l){return {cost:costScore(l),site:siteScore(l),cond:condScore(l),safe:safeScore(l)};}
function homeScore(l){const cs=catScores(l);const w=S.settings.weights||{cost:25,site:25,cond:30,safe:20};let sum=0,ws=0;for(const k in cs){if(cs[k]==null)continue;sum+=cs[k]*(+w[k]||0);ws+=(+w[k]||0);}return ws?Math.round(sum/ws):0;}
function riskFlags(l){const f=[];const r=jeonseRatio(l);if(r!=null&&r>=80)f.push(['bad',`전세가율 ${r}% 위험`]);else if(r!=null&&r>=70)f.push(['warn',`전세가율 ${r}% 주의`]);
  const ch=(l.safety||{}).checks||{};SAFETY_CHECKS.forEach(c=>{if(+ch[c[0]]===2)f.push(['bad',c[0]+' 문제']);});
  if(l.type!=='매매'&&!SAFETY_CHECKS.some(c=>+ch[c[0]]>0))f.push(['neutral','등기부 미확인']);
  const lv=+(l.safety||{}).lien;if(lv&&(+l.deposit)&&lv>(+l.deposit))f.push(['warn','선순위 채권 > 보증금']);
  return f;}

  destroy3D();

  if(tab==='list')renderList(v);
  else if(tab==='compare')renderCompare(v);

  else if(tab==='town')renderTown(v);

async function renderList(v){
  $('#title').innerHTML=BRAND.logo({height:21,dark:isDark()});

  let ls=[...S.listings];
  if(S.settings.sort==='cost')ls.sort((a,b)=>(monthly(a)||1e9)-(monthly(b)||1e9));
  else if(S.settings.sort==='score')ls.sort((a,b)=>homeScore(b)-homeScore(a));
  else if(S.settings.sort==='area')ls.sort((a,b)=>(+b.areaNet||0)-(+a.areaNet||0));
  else ls.sort((a,b)=>b.createdAt-a.createdAt);
  v.insertAdjacentHTML('beforeend',installBanner());

function photoGrid(ps,lid,rid){
  return `<div class="photos">${ps.map(p=>`<div class="ph" data-act="view" data-pid="${p.id}" data-lid="${lid}" data-rid="${rid||''}"><img src="${photoURL(p,true)}" alt="" loading="lazy">${p.caption?`<div class="cap">${esc(p.caption)}</div>`:''}</div>`).join('')}
    <button class="add" data-act="cam" data-lid="${lid}" data-rid="${rid||''}">${IC.camera}촬영</button>
    <button class="add" data-act="alb" data-lid="${lid}" data-rid="${rid||''}">${IC.image}앨범</button></div>`;}

  sec('비용 (만원)');

/* ========= 사진 처리 ========= */
async function loadBitmap(f){try{return await createImageBitmap(f,{imageOrientation:'from-image'});}catch(e){
  return await new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=URL.createObjectURL(f);});}}
function resizeTo(img,max,q){const w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',q));}
async function addPhotos(files,lid,rid){
  if(!files||!files.length)return;toast(`사진 ${files.length}장 저장 중…`);
  let n=0;
  for(const f of files){try{const bmp=await loadBitmap(f);const blob=await resizeTo(bmp,1600,.85);const thumb=await resizeTo(bmp,320,.7);
    await dbPut('photos',{id:uid(),listingId:lid,roomId:rid||null,blob,thumb,caption:'',createdAt:Date.now()+n});n++;if(bmp.close)bmp.close();}catch(e){console.error(e);}}
  toast(`사진 ${n}장 저장됨`);route();
}
async function openViewer(pid,lid,rid){
  const ps=rid?await dbIdx('photos','roomId',rid):(await dbIdx('photos','listingId',lid)).filter(p=>!p.roomId);
  ps.sort((a,b)=>a.createdAt-b.createdAt);viewPhotos=ps;viewIdx=Math.max(0,ps.findIndex(p=>p.id===pid));
  let el=$('#viewer');if(!el){el=document.createElement('div');el.id='viewer';el.className='viewer';document.body.appendChild(el);}
  drawViewer();
}
function drawViewer(){const el=$('#viewer');if(!el)return;const p=viewPhotos[viewIdx];if(!p){closeViewer();return;}
  el.innerHTML=`<div class="hd"><span>${viewIdx+1} / ${viewPhotos.length} · ${dateStr(p.createdAt)}</span><button data-act="vClose">✕</button></div>
  <div class="img" id="vImg"><img src="${photoURL(p)}" alt=""></div>
  <div class="bar"><button data-act="vPrev">‹</button><input placeholder="설명 (예: 화장실 곰팡이)" value="${esc(p.caption)}" data-act="noop" id="vCap"><button data-act="vNext">›</button><button data-act="vDel" style="background:#5a1d1d">삭제</button></div>`;
  const cap=$('#vCap');cap.addEventListener('change',()=>{p.caption=cap.value;dbPut('photos',p);});
  let sx=0;const im=$('#vImg');im.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
  im.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(dx<-50)nextPhoto(1);else if(dx>50)nextPhoto(-1);});
}
function nextPhoto(d){if(!viewPhotos.length)return;viewIdx=(viewIdx+d+viewPhotos.length)%viewPhotos.length;drawViewer();}
function closeViewer(){const el=$('#viewer');if(el)el.remove();route();}

/* ========= 평면도 ========= */
const plan={l:null,mode:'2d',scale:.1,ox:0,oy:0,sel:null,drag:null,canvas:null,ctx:null,ro:null};
const planRooms=l=>(l.rooms||[]).filter(r=>+r.w>0&&+r.d>0);
function autoArrange(l){const rs=planRooms(l).sort((a,b)=>KIND_ORDER.indexOf(a.kind)-KIND_ORDER.indexOf(b.kind));
  if(!rs.length)return;const tot=rs.reduce((a,r)=>a+(+r.w)*(+r.d),0);const maxW=Math.max(Math.sqrt(tot)*1.4,...rs.map(r=>+r.w));
  let x=0,y=0,rowH=0;rs.forEach(r=>{if(x>0&&x+(+r.w)>maxW){x=0;y+=rowH;rowH=0;}r.x=x;r.y=y;x+=(+r.w);rowH=Math.max(rowH,+r.d);});saveListing(l);}
function initPlan(l){plan.l=l;plan.mode='2d';plan.sel=null;plan.canvas=$('#plan');plan.ctx=plan.canvas.getContext('2d');
  if(planRooms(l).some(r=>r.x==null))autoArrange(l);
  const wrap=$('#planwrap');
  const size=()=>{const dpr=window.devicePixelRatio||1;plan.canvas.width=wrap.clientWidth*dpr;plan.canvas.height=wrap.clientHeight*dpr;plan.ctx.setTransform(dpr,0,0,dpr,0,0);fitPlan();drawPlan();};
  plan.ro=new ResizeObserver(()=>{if(plan.mode==='2d')size();else resize3D();});plan.ro.observe(wrap);
  size();
  bind2D(plan.canvas);
  updateSel();
}
function bind2D(cv){
  cv.onpointerdown=e=>{if(plan.mode!=='2d')return;const {x,y}=p2cm(e);const rs=planRooms(plan.l);let hit=null;for(let i=rs.length-1;i>=0;i--){const r=rs[i];if(x>=r.x&&x<=r.x+(+r.w)&&y>=r.y&&y<=r.y+(+r.d)){hit=r;break;}}
    plan.sel=hit?hit.id:null;if(hit){plan.drag={r:hit,dx:x-hit.x,dy:y-hit.y};cv.setPointerCapture(e.pointerId);}updateSel();drawPlan();};

/* ========= 도면 스케치 읽기 (Claude 비전) ========= */
const KIND_ALIAS={'부엌':'주방','키친':'주방','안방':'큰방','침실':'큰방','방':'작은방','작은 방':'작은방','큰 방':'큰방','욕실':'화장실','화장실':'화장실','샤워실':'화장실','발코니':'베란다','베란다':'베란다','다용도':'기타','다용도실':'기타','세탁실':'기타','드레스룸':'기타','창고':'기타','현관':'현관','거실':'거실','주방':'주방','큰방':'큰방','작은방':'작은방'};
function guessKind(name,kind){if(KINDS[kind])return kind;const n=(name||'').replace(/\s/g,'');for(const k in KIND_ALIAS)if(n.includes(k.replace(/\s/g,'')))return KIND_ALIAS[k];return '기타';}
let sketchRooms=[],sketchLid=null,sketchBlob=null;
const SKETCH_PROMPT=`이 사진은 손으로 그린 집 평면도 스케치다. 각 공간(방)을 찾아 아래 형식의 JSON 으로만 답하라. 설명·코드 블록 없이 JSON 본문만.
{"unit":"m" 또는 "cm","rooms":[{"name":"그림에 적힌 이름 그대로","kind":"거실|큰방|작은방|주방|화장실|베란다|현관|기타 중 하나","w":가로 길이,"d":세로 길이,"x":왼쪽 위 모서리 x,"y":왼쪽 위 모서리 y,"estimated":true 또는 false,"note":"추정 근거나 읽기 어려운 부분"}]}
규칙:
- 길이는 그림에 적힌 숫자를 그대로 쓴다. 단위는 그림 전체에서 하나로 정한다: 숫자가 대부분 20 미만이면 m, 그 이상이면 cm.
- 숫자가 적히지 않은 변은 맞닿은 이웃 공간의 길이나 그림의 비율로 추정하고 estimated 를 true 로 둔다.
- x,y 는 그림 배치를 그대로 옮긴 좌표다. 전체 그림의 왼쪽 위를 (0,0) 으로 두고 같은 단위를 쓴다. 공간끼리 겹치지 않게 한다.
- 이름이 없으면 kind 를 이름으로 쓴다. 한글 손글씨는 집 공간 이름(거실·부엌·안방·작은방·화장실·베란다·다용도·현관 등) 중 가장 가까운 것으로 읽는다.`;
let sketchPreview=null;   // 내장 방식: 번호 매긴 미리보기(dataURL)
const RANK_KIND=['거실','큰방','작은방','주방','화장실','베란다','현관','기타'];
async function readSketch(file,lid){
  const l=getL(lid);if(!l)return;sketchLid=lid;sketchPreview=null;
  const mode=S.settings.sketchMode||'local';
  showSheet('loading',mode==='local'?'사진에서 선과 방을 찾는 중…':'AI 가 평면도를 읽는 중… (10~30초)');
  try{
    const bmp=await loadBitmap(file);const blob=await resizeTo(bmp,1568,.85);sketchBlob=blob;
    if(mode==='local'){
      const det=detectRoomsFromImage(bmp);if(bmp.close)bmp.close();
      if(!det.rooms.length)throw new Error('네모(방)를 찾지 못했습니다. 종이를 정면에서 밝게 찍고, 벽선은 끊기지 않게 진하게 그려 주세요.');
      sketchPreview=det.preview;
      // 기본 비율: 전체 그림 가로를 700cm 로 가정 → 기준 길이 입력으로 다시 맞춤
      const f=700/det.bw;
      sketchRooms=det.rooms.map((r,i)=>({name:RANK_KIND[Math.min(r.rank,7)],kind:RANK_KIND[Math.min(r.rank,7)],pw:r.w,pd:r.h,px:r.x-det.bx,py:r.y-det.by,w:0,d:0,x:0,y:0,est:true,note:''}));
      applyScale(f);
    }else{
      const b64=await blobToB64(blob);if(bmp.close)bmp.close();
      const text=mode==='gemini'?await askGemini(b64):await askClaude(b64);
      const m=text.match(/\{[\s\S]*\}/);if(!m)throw new Error('응답에서 JSON 을 찾지 못했습니다.');
      const data=JSON.parse(m[0]);const k=(data.unit||'m')==='m'?100:1;
      sketchRooms=(data.rooms||[]).map(r=>({name:String(r.name||r.kind||'공간').trim(),kind:guessKind(r.name,r.kind),w:Math.round((+r.w||0)*k/10)*10,d:Math.round((+r.d||0)*k/10)*10,x:Math.round((+r.x||0)*k/10)*10,y:Math.round((+r.y||0)*k/10)*10,est:!!r.estimated,note:r.note||''})).filter(r=>r.w>0&&r.d>0);
      if(!sketchRooms.length)throw new Error('공간을 하나도 읽지 못했습니다. 방 이름과 길이를 더 또렷하게 적어 다시 찍어 보세요.');
    }
    drawSheet();
  }catch(e){console.error(e);$('.sheet-bg')?.remove();const msg=/Failed to fetch|NetworkError|Load failed/i.test(e.message)?'서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.':e.message;alert('도면 읽기 실패: '+msg);}
}
function applyScale(f){sketchRooms.forEach(r=>{if(r.pw==null)return;r.w=Math.max(10,Math.round(r.pw*f/10)*10);r.d=Math.max(10,Math.round(r.pd*f/10)*10);r.x=Math.round(r.px*f/10)*10;r.y=Math.round(r.py*f/10)*10;});}
async function askClaude(b64){
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':S.secret.apiKey,'anthropic-version':'2026-10-21','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-opus-5-5',max_tokens:4000,output_config:{effort:'high'},messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:SKETCH_PROMPT}]}]})});
  if(!res.ok){let msg='HTTP '+res.status;try{const j=await res.json();msg=j.error?.message||msg;}catch(e){}if(res.status===401)msg='Claude API 키가 틀렸거나 만료됐습니다. 설정에서 다시 넣어 주세요.';throw new Error(msg);}
  const j=await res.json();if(j.stop_reason==='refusal')throw new Error('모델이 이 사진 처리를 거절했습니다.');
  return (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');}
async function askGemini(b64){
  const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.secret.geminiKey},
    body:JSON.stringify({contents:[{parts:[{inline_data:{mime_type:'image/jpeg',data:b64}},{text:SKETCH_PROMPT}]}]})});
  if(!res.ok){let msg='HTTP '+res.status;try{const j=await res.json();msg=j.error?.message||msg;}catch(e){}if(res.status===400||res.status===403)msg='Gemini API 키가 틀렸거나 권한이 없습니다. 설정에서 다시 넣어 주세요. ('+msg+')';throw new Error(msg);}
  const j=await res.json();return (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('\n');}

/* ---- 내장 도면 인식: 사진 → 잉크 → 직선(허프) → 격자 → 벽으로 안 막힌 칸 합치기 → 방 네모 ---- */
function detectRoomsFromImage(bmp){
  const maxS=1400,s=Math.min(1,maxS/Math.max(bmp.width,bmp.height));const W=Math.round(bmp.width*s),H=Math.round(bmp.height*s);
  const c=document.createElement('canvas');c.width=W;c.height=H;const cx=c.getContext('2d');cx.drawImage(bmp,0,0,W,H);
  const d=cx.getImageData(0,0,W,H).data;const g=new Float32Array(W*H);for(let i=0;i<W*H;i++)g[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];
  // 주변 평균보다 많이 어두운 점 = 펜 잉크 (연한 공책 줄은 제외)
  const I=new Float64Array((W+1)*(H+1));for(let y=1;y<=H;y++){let row=0;for(let x=1;x<=W;x++){row+=g[(y-1)*W+x-1];I[y*(W+1)+x]=I[(y-1)*(W+1)+x]+row;}}
  const R=Math.round(Math.max(W,H)/40);const raw=new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const x0=Math.max(0,x-R),x1=Math.min(W,x+R+1),y0=Math.max(0,y-R),y1=Math.min(H,y+R+1);
    const mean=(I[y1*(W+1)+x1]-I[y0*(W+1)+x1]-I[y1*(W+1)+x0]+I[y0*(W+1)+x0])/((x1-x0)*(y1-y0));if(g[y*W+x]<mean*0.62)raw[y*W+x]=1;}
  // 외톨이 점은 버림(펜 획은 이웃이 있음)
  const ink=new Uint8Array(W*H);
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x;if(raw[i]&&(raw[i-W]||raw[i+W]||raw[i-1]||raw[i+1]))ink[i]=1;}
  const out={rooms:[],preview:null,bx:0,by:0,bw:1,bh:1,rad:0,W,H,tried:[]};
  const near=(a,b,m)=>!(a.x>b.x+b.w+m||b.x>a.x+a.w+m||a.y>b.y+b.h+m||b.y>a.y+a.h+m);
  const wall=new Uint8Array(W*H),lab=new Uint8Array(W*H),stack=new Int32Array(W*H);
  // 벽을 rad 만큼 두껍게(모서리 틈 메움) → 선으로 둘러싸인 빈 영역을 채워서 찾음 = 방
  function floodAt(rad){
    wall.fill(0);lab.fill(0);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(!ink[y*W+x])continue;for(let dy=-rad;dy<=rad;dy++){const yy=y+dy;if(yy<0||yy>=H)continue;const base=yy*W;for(let dx=-rad;dx<=rad;dx++){const xx=x+dx;if(xx>=0&&xx<W)wall[base+xx]=1;}}}
    const regions=[];
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i0=y*W+x;if(wall[i0]||lab[i0])continue;
      let sp=0,area=0,x0=x,x1=x,y0=y,y1=y,border=false;stack[sp++]=i0;lab[i0]=1;
      while(sp){const i=stack[--sp];const px=i%W,py=(i-px)/W;area++;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py;if(px===0||py===0||px===W-1||py===H-1)border=true;

    <div class="field"><label>제목</label><input class="inp" id="cpTitle" value="${esc(titleV)}" placeholder="${compose.kind==='home'?'역삼동 투룸 이 가격 괜찮을까요?':compose.kind==='ask'?'이 동네 밤에 시끄러운가요?':'우리 동네 주차 꿀팁'}"></div>
    <div class="field"><label>내용</label><textarea class="inp" id="cpText" placeholder="이웃에게 하고 싶은 말">${esc(textV)}</textarea></div>`;
  $('#sheetFt').innerHTML=`<button class="btn ghost" data-act="sheetClose" style="flex:1">취소</button><button class="btn" data-act="pPost" style="flex:2">${sb.on()?'동네에 올리기':'올리고 공유하기'}</button>`;}
async function submitPost(){const title=($('#cpTitle').value||'').trim();if(!title){toast('제목을 적어 주세요');return;}
  const lid=compose.kind==='home'?($('#cpLid')?.value||''):'';const l=lid?getL(lid):null;
  const post={id:uid(),dong:S.settings.dong||'우리 동네',nick:S.settings.nick||'이웃',kind:compose.kind,title,text:($('#cpText').value||'').trim(),sum:l?summarize(l):null,createdAt:Date.now(),mine:true,src:'local'};
  await dbPut('posts',post);
  if(sb.on()){try{await sb.add(post);post.src='server';await dbPut('posts',post);toastM('동네에 올렸어요');}catch(e){alert('서버에 올리지 못해 내 폰에만 저장했습니다: '+e.message);}}
  $('.sheet-bg')?.remove();rerender();
  if(!sb.on()){setTimeout(()=>sharePost(post),300);}}
function postUrl(p){const d={id:p.id,dong:p.dong,nick:p.nick,kind:p.kind,title:p.title,text:p.text,sum:p.sum,createdAt:p.createdAt};return location.origin+location.pathname+'#p/'+b64u.enc(JSON.stringify(d));}
async function sharePost(p){const url=postUrl(p);const m=p.sum;const sumT=m?'\n'+(m.type||'')+' '+(m.type==='매매'?fmtMan(m.price):m.type==='전세'?fmtMan(m.deposit):fmtMan(m.deposit)+'/'+fmtMan(m.rent))+(m.areaNet?' · 전용 '+areaStr(+m.areaNet):'')+' · 월 '+fmtMan1(m.monthly):'';
  const text='[집어봐] '+p.title+(p.text?'\n'+p.text:'')+sumT+'\n링크를 열면 집어봐 앱에 그대로 들어와요.';
  if(navigator.share){try{await navigator.share({title:'집어봐 · '+p.title,text,url});return;}catch(e){if(e.name==='AbortError')return;}}
  try{await navigator.clipboard.writeText(text+'\n'+url);toast('글과 링크를 복사했습니다. 단톡방에 붙여 넣으세요');}catch(e){prompt('복사해서 보내세요',url);}}
async function importSharedPost(b){try{const d=JSON.parse(b64u.dec(b));if(!d||!d.id||!d.title)throw new Error('형식');
    const ex=await dbGet('posts',d.id);if(!ex){await dbPut('posts',Object.assign(d,{src:'link',mine:false,createdAt:d.createdAt||Date.now()}));toastM('이웃의 집 얘기를 받았어요');}else toast('이미 받은 글이에요');
    if(d.dong&&!S.settings.dong){S.settings.dong=d.dong;saveSettings();}
  }catch(e){toast('공유 링크를 읽지 못했습니다');}
  history.replaceState(null,'','#town');route();}

/* ========= 온보딩(첫 실행) ========= */
let onbIdx=0;
const ONB=[
  {art:'<div style="display:flex;flex-direction:column;align-items:center;gap:6px">'+BRAND.mark({size:150})+BRAND.logo({height:38}).replace(/<svg[\s\S]*?<\/svg>/,'')+'</div>',h:'좋은 집, 콕 집어봐!',p:'집 보러 다닐 때 본 집들을 담아 두고<br>한눈에 비교해서 고르는 나만의 노트예요.'},
  {art:BRAND.mascot('search',170),h:'본 집을 그대로 담기',p:'가격·관리비·대출, 방 크기와 사진, 수압·곰팡이 같은 점검 항목까지.<br>손그림 도면을 찍으면 평면도와 3D 도 만들어져요.'},
  {art:BRAND.mascot('love',170),h:'나란히 놓고 콕 집기',p:'월 실질 비용, 초기 비용, 안전·계약 확인, 입지까지 표로 비교하고<br>내 기준 가중치로 점수를 매겨요.'},
];
function showOnboarding(){onbIdx=0;const el=document.createElement('div');el.className='onb';el.id='onb';document.body.appendChild(el);drawOnb();}
function drawOnb(){const el=$('#onb');if(!el)return;const x=ONB[onbIdx];
  el.innerHTML=`<button class="skip" data-act="onbDone">건너뛰기</button><div class="art">${x.art}</div><h3>${x.h}</h3><p>${x.p}</p><div class="dots">${ONB.map((_,i)=>`<i class="${i===onbIdx?'on':''}"></i>`).join('')}</div><div class="btns">${onbIdx<ONB.length-1?`<button class="btn" style="flex:1" data-act="onbNext">다음</button>`:`<button class="btn" style="flex:1" data-act="onbDone">시작하기</button>`}</div>`;}

/* ========= 시작 ========= */
async function loadAll(){S.listings=(await dbAll('listings')).map(fix);const kv=await dbGet('kv','settings');S.settings=Object.assign({rate:4,unit:'평',compare:[],sort:'created',theme:'',weights:{cost:25,site:25,cond:30,safe:20}},kv?kv.v:{});const sc=await dbGet('kv','secret');S.secret=Object.assign({apiKey:'',geminiKey:'',sbUrl:'',sbKey:''},sc?sc.v:{});if(!S.settings.deviceId){S.settings.deviceId=uid()+uid();saveSettings();}applyTheme();}
(async()=>{try{await openDB();await loadAll();}catch(e){document.body.innerHTML=`<div class="empty">저장소를 열 수 없습니다.<br><small>${esc(e.message)}</small><br><br>Chrome 또는 Safari 에서 열어 주세요.</div>`;return;}
  if(!location.hash)location.hash='#list';else route();
  if(!(await dbGet('kv','onboarded')))showOnboarding();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
})();
</script>
